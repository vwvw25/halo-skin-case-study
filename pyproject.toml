[project]
name = "meta-reporting"
version = "0.1.0"
description = "Automated Meta ads LTV:CAC reporting pipeline for Halo Skin (portfolio case study)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Victoria Ward" }]
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "pandas>=2.2",
]

[project.scripts]
halo-report = "meta_reporting.pipeline:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_reporting"]

[tool.uv]
# dev extras are installed by default for local work; CI installs them explicitly
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
